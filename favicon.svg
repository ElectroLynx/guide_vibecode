<!-- Sure! Here's a simple favicon SVG 🚀 -->
<!-- This icon is a dark rounded square with a lime "V" on top. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Outer rounded rectangle (the background) -->
  <rect width="32" height="32" rx="8" fill="#11110f"/>
  <!-- Inner lime rounded rectangle -->
  <rect x="6" y="6" width="20" height="20" rx="4" fill="#e7ff3d"/>
  <!-- The letter V, centered -->
  <text x="16" y="21" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" font-weight="700" fill="#11110f">V</text>
</svg>
